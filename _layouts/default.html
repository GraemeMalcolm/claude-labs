<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.lab.title %}{{ page.lab.title }} | {% endif %}{{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <style>
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1f2328;
      background: #ffffff;
      margin: 0;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    header.site-header {
      border-bottom: 1px solid #d0d7de;
      padding: 1rem 0;
    }
    header.site-header a {
      font-weight: 600;
      color: #1f2328;
      text-decoration: none;
    }
    a { color: #0969da; }
    h1, h2, h3 { line-height: 1.25; }
    code, pre { font-family: Consolas, "Courier New", monospace; }
    pre {
      background: #f6f8fa;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      border-radius: 6px;
    }
    code { background: #f6f8fa; padding: 0.1em 0.3em; border-radius: 4px; }
    pre code { background: none; padding: 0; }
    blockquote {
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      border-left: 4px solid #d0d7de;
      color: #57606a;
    }
    img { max-width: 100%; height: auto; }
    table { border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #d0d7de; padding: 0.4rem 0.7rem; text-align: left; }
    .lab-list { list-style: none; padding: 0; }
    .lab-list li {
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .lab-list li a { font-size: 1.15rem; font-weight: 600; }
    .lab-list li p { margin: 0.4rem 0 0; color: #57606a; }
    .back-link { display: inline-block; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container" style="padding-top:0;padding-bottom:0;">
      <a href="{% if page.lab %}../{% else %}./{% endif %}">{{ site.title }}</a>
    </div>
  </header>
  <main class="container">
    {{ content }}
  </main>
</body>
</html>
