title: Claude Labs
description: Hands-on labs for building AI agents with the Claude platform.

# Render the lab Markdown with kramdown (GitHub Flavored Markdown input, the Pages default),
# which supports the ``` fenced code blocks used in the lab files
markdown: kramdown

# Only the Instructions folder and the home page are published.
# The client apps contain Jinja templates and Python code that Jekyll should not process.
exclude:
  - computer-history-client
  - managed-agent-client
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: "Instructions"
    values:
      layout: lab
